name: Convert the Matter data model to SDF

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

env:
  # Keep in sync with MATTER_ALL_SUPPORTED_VERSIONS in the Makefile
  MATTER_VERSIONS: "1.0 1.1 1.2 1.3 1.4 1.4.1 1.4.2 1.5 1.5.1 1.6"

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
      - uses: actions/checkout@v4
      - name: Set reusable strings
        # Turn repeated input strings (such as the build output directory) into step outputs. These step outputs can be used throughout the workflow file.
        id: strings
        shell: bash
        run: |
          echo "build-output-dir=${{ github.workspace }}/build" >> "$GITHUB_OUTPUT"
      - name: Configure CMake
        # Configure CMake in a 'build' subdirectory. `CMAKE_BUILD_TYPE` is only required if you are using a single-configuration generator such as make.
        # See https://cmake.org/cmake/help/latest/variable/CMAKE_BUILD_TYPE.html?highlight=cmake_build_type
        run: >
          cmake -B ${{ steps.strings.outputs.build-output-dir }}
          -DCMAKE_CXX_COMPILER=g++
          -DCMAKE_C_COMPILER=gcc
          -DCMAKE_BUILD_TYPE=Release
          -S ${{ github.workspace }}
      - name: Build
        run: cmake --build ${{ steps.strings.outputs.build-output-dir }} --config Release
      - name: Pull Matter files
        run: git clone --depth=1 https://github.com/project-chip/connectedhomeip.git ${{ github.workspace }}/matter
      - name: Convert Matter files
        run: |
          for version in $MATTER_VERSIONS; do
            echo "::group::Matter $version"
            data_model="${{ github.workspace }}/matter/data_model/$version"
            if [[ ! -d "$data_model" ]]; then
              echo "::error::Matter data model $version not found"
              exit 1
            fi
            mkdir -p "${{ github.workspace }}/converted/$version"
            for file in "$data_model"/device_types/*.xml; do
              echo "Processing $file"
              ${{ steps.strings.outputs.build-output-dir }}/sdf_matter_converter --matter-to-sdf -device-xml "$file" -cluster-xml "$data_model/clusters" -o "${{ github.workspace }}/converted/$version/$(basename "$file" .xml).json"
            done
            echo "::endgroup::"
          done
      - uses: actions/upload-artifact@v4
        with:
          name: Converted Matter files
          path: ${{ github.workspace }}/converted/**/*.json
